<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Anud 🎉</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  height:100vh;
  background:#000;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Animated Neon Gradient Background */
.bg{
  position:absolute;
  width:150%;
  height:150%;
  background:conic-gradient(
      #ff00ff,
      #ff0057,
      #ff9a00,
      #ffee00,
      #33ff00,
      #00ffd5,
      #00a2ff,
      #8000ff,
      #ff00ff
  );
  animation:rotate 14s linear infinite;
  filter:blur(60px);
  opacity:.35;
}
@keyframes rotate{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* Neon Rings */
.ring{
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.3);
  backdrop-filter:blur(10px);
  animation:pulse 4s infinite alternate ease-in-out;
}
.ring:nth-child(1){top:12%;left:8%;border-color:#ff008c;}
.ring:nth-child(2){bottom:8%;right:10%;border-color:#00ffd0;}
@keyframes pulse{
  from{transform:scale(1);}
  to{transform:scale(1.25);}
}

/* Glass Card */
.card{
  width:92%;
  max-width:400px;
  padding:28px;
  border-radius:28px;
  background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.3);
  box-shadow:0 0 35px rgba(255,255,255,.2);
  backdrop-filter:blur(12px);
  text-align:center;
  z-index:3;
}

/* Text */
.title{
  font-size:28px;
  letter-spacing:1px;
}
.name{
  margin-top:6px;
  font-size:36px;
  font-weight:700;
  background:linear-gradient(90deg,#ff00ff,#ff7a00,#ffee00,#00e6ff,#9d00ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.msg{
  margin-top:10px;
  font-size:14px;
  line-height:1.6;
  opacity:.9;
}

/* Button */
.btn{
  margin-top:22px;
  width:100%;
  padding:13px;
  border-radius:40px;
  border:none;
  letter-spacing:1px;
  color:#000;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
  background:linear-gradient(135deg,#ff00ff,#ff7b00,#ffee00,#00ffef,#7a00ff);
  background-size:300%;
  animation:btnGlow 4s linear infinite;
}
@keyframes btnGlow{
  0%{background-position:0%;}
  100%{background-position:400%;}
}
.btn:active{transform:scale(.96);}

/* Color Sparks */
.spark{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(720deg);}
}

/* Mobile Friendly */
@media(max-width:480px){
  .name{font-size:32px;}
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="ring"></div>
<div class="ring"></div>

<div class="card">
  <div class="title">🎂 Happy Birthday</div>
  <div class="name">Anud Saud</div>

  <p class="msg">
    Bright colors, bright vibes and brighter happiness!  
    May your year be full of success, joy, love and endless smiles.
    Keep shining beautifully 💖
  </p>

  <button class="btn" onclick="celebrate()">Tap to Celebrate 🎉</button>
</div>

<script>
function celebrate(){
  for(let i=0;i<150;i++){
    let s=document.createElement("div");
    s.classList.add("spark");
    s.style.left=Math.random()*100+"vw";
    s.style.top="-10px";
    s.style.background=`hsl(${Math.random()*360},100%,60%)`;
    s.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),5000);
  }
}
</script>

</body>
</html>
